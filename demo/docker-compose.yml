# Demo database for pg-guard-sql: Postgres 17 with the sample schema (RLS, two users) loaded.
#   npm run demo:up   # start and wait until healthy
#   npm run demo      # run the injected-SQL demo as Alice
#   npm run demo:down # stop and delete the data
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: owner
      POSTGRES_PASSWORD: owner
      POSTGRES_DB: shop
    ports:
      - "54329:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owner -d shop"]
      interval: 2s
      timeout: 3s
      retries: 30
